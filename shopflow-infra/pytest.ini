; Repository-wide pytest configuration (shopflow-infra).
;
; A bare `python -m pytest` at the repository root runs both suites:
;   emulator/tests  - the provider-emulator contract tests (contracts.md §7)
;   scripts/tests   - the infra scripts' own logic (no docker, no services)
;
; The per-directory `emulator/pytest.ini` still applies when the emulator suite
; is invoked explicitly, e.g. `python -m pytest emulator/tests -q`.
[pytest]
testpaths =
    emulator/tests
    scripts/tests
addopts = -ra
filterwarnings =
    ignore::DeprecationWarning
    ignore:Using `httpx` with `starlette.testclient` is deprecated.*
