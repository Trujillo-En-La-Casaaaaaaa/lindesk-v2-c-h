# ShopFlow local broker (RabbitMQ) - contracts.md §8.
#
# The durable topology (topic exchange `shopflow.orders`, durable queue
# `shopflow.notifications.order-events` and the two routing-key bindings) is
# applied declaratively at boot, so a consumer never races broker bootstrapping
# and no service has to declare topology itself. See definitions.json.
management.load_definitions = /etc/rabbitmq/definitions.json

# Local, credential-free defaults only: the user is created from
# RABBITMQ_DEFAULT_USER / RABBITMQ_DEFAULT_PASS in docker-compose.yml (.env).

# Keep the local footprint predictable.
vm_memory_high_watermark.relative = 0.6
