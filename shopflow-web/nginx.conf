# Static host for the built single page application.
#
# Client-side routes are handled by the SPA itself, so unknown paths fall back to
# index.html. No /api proxy is declared on purpose: the browser calls the gateway
# directly through VITE_GATEWAY_BASE_URL (contracts.md §2, §11).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
