# Alembic configuration of shopflow-orders.
#
# The migration environment (migrations/env.py) reads DATABASE_URL from the
# environment (contracts.md §11) and injects it at runtime; the placeholder below
# only keeps `alembic` usable when no environment variable is set. The port is the
# one shopflow-infra publishes for the orders store (localhost:5433).
[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
version_path_separator = os
file_template = %%(rev)s_%%(slug)s
timezone = UTC
sqlalchemy.url = postgresql://shopflow:shopflow@localhost:5433/shopflow_orders

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
